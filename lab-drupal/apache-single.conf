# Single prefork child for deterministic worker pairing. MaxConnectionsPerChild
# gives a fresh child per request; the parent's address space (and the ZendMM
# main chunk) is inherited, so measure and fire use the same main.
<IfModule mpm_prefork_module>
    StartServers          1
    MinSpareServers       1
    MaxSpareServers       1
    MaxRequestWorkers     1
    ServerLimit           1
    MaxConnectionsPerChild 1
</IfModule>

Timeout 120
KeepAlive Off
