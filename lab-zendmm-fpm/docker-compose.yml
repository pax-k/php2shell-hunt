services:
  php:
    image: php-zendmm-fpm-lab:local
    build: .
    container_name: php2shell-zendmm-fpm
    volumes:
      - ../lab-chain-a/webroot:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: php2shell-zendmm-nginx
    ports: ["18085:80"]
    volumes:
      - ../lab-chain-a/webroot:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
