[www]
user = www-data
group = www-data
listen = 9000
listen.backlog = 511

; Four children, fixed. Occupying three leaves exactly one for the chain.
pm = static
pm.max_children = 4
pm.max_requests = 0

; Holders must survive the pinning window; don't reap them early.
request_terminate_timeout = 120s
request_slowlog_timeout = 0

clear_env = no
catch_workers_output = yes
decorate_workers_output = yes
