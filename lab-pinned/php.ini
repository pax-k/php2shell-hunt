; php2shell multi-worker FPM lab — pinning research.
; Four fixed children so the N-1 holder primitive is observable. This is
; the same worker model as the rung-5b lab, but with >1 child: the point is
; to prove the chain can be pinned to one of them rather than sidestepping
; pinning with pm.max_children=1.
memory_limit = 128M
post_max_size = 128M
upload_max_filesize = 128M
max_input_vars = 1000
max_execution_time = 30
max_input_time = 30

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
html_errors = Off

session.save_handler = files
session.save_path = "/tmp/sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0

session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = 0
