services:
  php:
    image: php:8.2-fpm
    container_name: php2shell-pinned
    volumes:
      - ../lab-chain-a/webroot:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini:ro
      - ./www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    command: >
      bash -c "mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions && exec php-fpm"

  nginx:
    image: nginx:alpine
    container_name: php2shell-pinned-nginx
    ports: ["18097:80"]
    volumes:
      - ../lab-chain-a/webroot:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
