# Four fixed prefork children so worker pinning is observable and cheap.
# (The public 9bie chain pins 149/150; the mechanism is identical at n=4.)
<IfModule mpm_prefork_module>
    StartServers          4
    MinSpareServers       4
    MaxSpareServers       4
    MaxRequestWorkers     4
    ServerLimit           4
    MaxConnectionsPerChild 0
</IfModule>

# Keep stalled holders alive long enough for the pinning window.
Timeout 120
KeepAlive Off
