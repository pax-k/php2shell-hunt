; php2shell 8.5.11 mod_php lab — dinosn in-band chain profile.
; Preconditions (dinosn docs/END-TO-END.md): display_errors=On (stock 8.5.11
; image default is On), memory_limit < OOM field (16M vs 24M `--huge`), and
; post_max_size >= OOM field (32M), single-worker prefork.
memory_limit = 16M
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 1000
max_file_uploads = 20
max_execution_time = 60
max_input_time = 60

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
html_errors = Off

session.save_handler = files
session.save_path = "/tmp/sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0

session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = 0