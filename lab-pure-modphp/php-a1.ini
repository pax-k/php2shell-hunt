; php2shell stock mod_php lab — A1/B1 leak profile (9bie shape).
; The 860 depth-64 nested parts need the parser limits out of the way;
; stock php.ini-production truncates them (POST count ~114), which is why
; the public A1 shape silently fails on some targets. This profile keeps
; the memory/post limits stock (128M/8M, display_errors=Off) and lifts
; only the input-count knobs so the A1 heap shape can be evaluated.
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 8M
max_input_vars = 100000
max_input_nesting_level = 64
max_file_uploads = 1000
max_execution_time = 30
max_input_time = 30

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
html_errors = Off

session.save_handler = files
session.save_path = "/tmp/sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0

session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = 0
