; php2shell stock mod_php lab — production-ish profile (9bie 128M target).
; Used for the legacy 1005-part chain (Wiz Variant 1) and the chunked
; post_max_size bypass: the declared 12 MB body is rejected, the same
; body with Transfer-Encoding: chunked is parsed.
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 8M
max_input_vars = 1000
max_file_uploads = 20
max_execution_time = 30
max_input_time = 30

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
html_errors = Off

session.save_handler = files
session.save_path = "/tmp/sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0

session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = 0
