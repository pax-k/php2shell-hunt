; CVE-2026-109618 OOM-corruption lab — low-limit profile.
; memory_limit=8M makes the corrupting key allocation small and
; deterministic; post_max_size=1G lets the urlencoded body through.
; The oracle/leak 9bie chain is calibrated at 128M, not here.

memory_limit = 8M
post_max_size = 1G
upload_max_filesize = 1G
max_input_vars = 1000
max_input_nesting_level = 64
max_input_time = -1

display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = Off
error_reporting = E_ALL
