[Session]
; CVE-2026-115560 race profile: DEFAULT cleanup=On.
; The upload-progress record is erased at MULTIPART_EVENT_END, so the exploit
; must be consumed by a concurrent request while the upload is still streaming
; (see poc/verify_115560_race.py).
session.save_handler = files
session.save_path = /tmp/sessions
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0
session.serialize_handler = php_serialize
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.prefix = upload_progress_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0

[PHP]
display_errors = On
error_reporting = E_ALL
file_uploads = On
post_max_size = 128M
upload_max_filesize = 128M
memory_limit = 128M
