# Multi-child prefork pool for the cleanup=On race: the streaming upload holds
# one child while the concurrent consumer GET needs a second child.
#
# MaxConnectionsPerChild=1 keeps every request on a freshly forked child. All
# children inherit the parent's ZendMM main chunk, so the measured carrier
# delta is valid for the fire request even though it runs on another child.
<IfModule mpm_prefork_module>
    StartServers           4
    MinSpareServers        4
    MaxSpareServers        8
    MaxRequestWorkers      8
    ServerLimit            8
    MaxConnectionsPerChild 1
</IfModule>

Timeout 120
KeepAlive Off
