# Single prefork child — deterministic worker pairing for the measure/fire
# sequence. MaxConnectionsPerChild=1 gives a fresh child per request; the
# parent's address space (and therefore the ZendMM main chunk) is inherited.
<IfModule mpm_prefork_module>
    StartServers          1
    MinSpareServers       1
    MaxSpareServers       1
    MaxRequestWorkers     1
    ServerLimit           1
    MaxConnectionsPerChild 1
</IfModule>

Timeout 120
KeepAlive Off
