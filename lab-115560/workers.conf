# LAB-ONLY: 8 persistent prefork children (action D, multi-worker pinning).
#
# Unlike apache-single.conf this does NOT set MaxConnectionsPerChild=1: the
# children are long-lived so the ZendMM main chunk (allocated in the parent /
# first child and fork-inherited) is the same mapping in every worker.
# MaxRequestWorkers=8 gives 7 holders + 1 free worker for the chain, matching
# the 9bie/devploit "N-1 stalled connections" primitive.
<IfModule mpm_prefork_module>
    StartServers           8
    MinSpareServers        8
    MaxSpareServers        8
    MaxRequestWorkers      8
    ServerLimit            8
    MaxConnectionsPerChild 0
</IfModule>

Timeout 120
KeepAlive Off
