[Session]
; CVE-2026-115560 precondition 1: configured handler is php_serialize.
; The app (Roundcube plugin) switches to "php" at runtime before
; session_start(); stock Roundcube does this in register_session_handler().
session.save_handler = files
session.save_path = /tmp/sessions
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0
session.serialize_handler = php_serialize
; precondition 2: upload progress on. cleanup=Off keeps the record for the
; direct proof (the cleanup=On race is proven separately in lab-115560).
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = upload_progress_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0

[PHP]
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
file_uploads = On
post_max_size = 128M
upload_max_filesize = 128M
memory_limit = 256M
log_errors = Off
