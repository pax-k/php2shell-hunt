; PHP 8.5 compatibility shim for the Roundcube 1.6.11 lab only.
;
; program/lib/Roundcube/bootstrap.php unconditionally declares a global
; array_first() polyfill, but PHP 8.5 added array_first() as a builtin, so
; stock Roundcube 1.6.11 fatals at bootstrap on 8.5.12:
;   "Cannot redeclare function array_first()".
; Removing the builtin from the function table lets Roundcube's own polyfill
; load. This is unrelated to CVE-2026-115560 and does not touch zif_system.
disable_functions = array_first
