[Session]
; LAB-ONLY Redis variant of the CVE-2026-115560 precondition.
; The *server* save handler is phpredis; php_serialize is the writer used by
; the rfc1867 upload-progress hook.
session.save_handler = redis
; phpredis 6.3.0 supports a "prefix" query parameter (redis_session.c). An
; empty prefix removes the default PHPREDIS_SESSION: namespace, so the hook
; writes the same key Roundcube's driver reads (raw session id).
session.save_path = "tcp://redis:6379?prefix="
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0
session.serialize_handler = php_serialize
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = upload_progress_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0
; Deterministic single record; no cross-request lock.
redis.session.locking_enabled = 0

[PHP]
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
file_uploads = On
post_max_size = 128M
upload_max_filesize = 128M
memory_limit = 256M
log_errors = Off
