# Source: https://www.wiz.io/blog/php2shell-exploitation-so-far
# TLP:CLEAR. Correlate with detection/suricata_php2shell_upload_progress.rules.
#
# Context: Wiz observed only failed end-to-end attempts. The IPs below are
# exploitation attempts / scanners / one C2, not confirmed compromises.
# Absence of a hit is not proof of safety; the request-shape rules matter
# more than the IP list.

