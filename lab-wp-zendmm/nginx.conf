server {
    listen 80;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 32m;
    location / {
        # WordPress permalinks + the chain endpoints (app/, api/) coexist
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Stream the body as it arrives (matches lab/ and the real-world
        # misconfiguration the public writeups assume for chunked input).
        fastcgi_request_buffering off;
    }
    location ~ /\.ht {
        deny all;
    }
}
