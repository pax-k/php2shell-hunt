[www]
; php_admin_value entries cannot be overridden by .user.ini (the
; cross-directory mismatch precondition dies here), and upload-progress
; is disabled at the SAPI level — the advisory's administrative
; mitigations.
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /tmp/sessions
php_admin_value[session.serialize_handler] = php_serialize
php_admin_value[session.upload_progress.enabled] = 0
php_admin_value[session.use_strict_mode] = 1
php_admin_value[session.use_only_cookies] = 1
php_admin_value[memory_limit] = -1
php_admin_value[display_errors] = stderr
php_admin_value[post_max_size] = 8M
php_admin_value[max_execution_time] = 30
